name: CADDTARD AI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: "caddtard-ai 3"

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "caddtard-ai 3/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - run: pytest -v
      - run: python verify_schema.py
      - run: python verify_schema_v3.py
      - run: python verify_ops_schema.py

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caddtard
          POSTGRES_PASSWORD: caddtard
          POSTGRES_DB: caddtard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caddtard -d caddtard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://caddtard:caddtard@localhost:5432/caddtard_test
      AGENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "caddtard-ai 3/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t caddtard-ai:${{ github.sha }} .
