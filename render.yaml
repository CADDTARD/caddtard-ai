databases:
  - name: caddtard-postgres
    databaseName: caddtard
    user: caddtard

services:
  - type: web
    name: caddtard-ai
    runtime: docker
    rootDir: "caddtard-ai 3"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caddtard-postgres
          property: connectionString
      - key: AGENTS_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "https://caddtard-ai.onrender.com"
      - key: PATENTSVIEW_API_KEY
        sync: false
